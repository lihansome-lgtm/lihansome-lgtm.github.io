<!DOCTYPE html>
<html lang="tl">
<head>
    <script>
if(localStorage.getItem("bossniddo_loggedin") !== "yes") {
    window.location.href = "login.html";
}
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — HitForgeStudio</title>
    <style>
        body {
            background-image: url("Bossing.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(30,10,50,0.85));
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px #ff2eeb, 0 0 40px #00ff41;
            text-align: center;
            width: 340px;
            border: 2px solid rgba(0,255,65,0.3);
        }
        .logo-text {
            font-size: 36px;
            font-weight: 900;
            color: #ff2eeb;
            text-shadow: 0 0 10px #ff2eeb, 0 0 20px #ff2eeb, 0 0 40px #00ff41;
            margin-bottom: 5px;
        }
        .sub-text {
            color: #00ff41;
            font-size: 18px;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background: rgba(60,60,60,0.8);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff41;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff2eeb, #00ff41);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.3s;
        }
        button:hover { transform: scale(1.03); }
        .error-msg { color: #ff4444; margin-top: 12px; display: none; }
        .success-msg { color: #00ff41; margin-top: 12px; display: none; }
        @media (max-width: 480px) {
            .login-box { width: 90%; padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo-text">BOSS NIDDO</div>
        <div class="sub-text">HitForgeStudio</div>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="👤 Username" required>
            <input type="password" id="password" placeholder="🔒 Password" required>
            <button type="submit">🔐 Pumasok</button>
        </form>
        
        <p class="error-msg" id="errorMsg">❌ Maling username o password!</p>
        <p class="success-msg" id="successMsg">✅ Tama! Papasok ka na...</p>
    </div>

    <script>
        // === IYONG PAGPASOK — PALITAN MO KUNG GUSTO MO ===
        const USERNAME = "bossniddo";
        const PASSWORD = "123456"; // ⚠️ GAWING SARILI MO!

        function goToMainPage() {
            localStorage.setItem("bossniddo_loggedin", "yes");
            document.getElementById("successMsg").style.display = "block";
            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);
        }

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;

            if(user === USERNAME && pass === PASSWORD) {
                goToMainPage();
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        });
    </script>
</body>
</html>
