<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — HitForgeStudio</title>
    <!-- Google Sign-In API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Facebook SDK -->
    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId      : 'PALITAN_ITO_FB_APPID',
                cookie     : true,
                xfbml      : true,
                version    : 'v21.0'
            });
        };
    </script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
    
    <style>
        body {
            background-image: url("Bossing.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(30,10,50,0.85));
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px #ff2eeb, 0 0 40px #00ff41;
            text-align: center;
            width: 340px;
            border: 2px solid rgba(0,255,65,0.3);
        }
        .logo-text {
            font-size: 36px;
            font-weight: 900;
            color: #ff2eeb;
            text-shadow: 0 0 10px #ff2eeb, 0 0 20px #ff2eeb, 0 0 40px #00ff41;
            margin-bottom: 5px;
        }
        .sub-text {
            color: #00ff41;
            font-size: 18px;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }
        .divider {
            color: #aaa;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }
        .social-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 6px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.3s;
        }
        .social-btn:hover { transform: scale(1.03); }
        .fb-btn {
            background: #1877F2;
            color: white;
        }
        .google-btn {
            background: white;
            color: #444;
        }
        .manual-divider {
            margin-top: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background: rgba(60,60,60,0.8);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff41;
        }
        .pass-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff2eeb, #00ff41);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg {
            color: #ff4444;
            margin-top: 12px;
            display: none;
        }
        .success-msg {
            color: #00ff41;
            margin-top: 12px;
            display: none;
        }
        /* Google button container */
        #g_id_onload, .g_id_signin {
            width: 100% !important;
            justify-content: center;
        }
        @media (max-width: 480px) {
            .login-box { width: 90%; padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo-text">BOSS NIDDO</div>
        <div class="sub-text">HitForgeStudio</div>

        <!-- GOOGLE LOGIN -->
        <div id="g_id_onload"
             data-client_id="PALITAN_ITO_GOOGLE_CLIENTID.apps.googleusercontent.com"
             data-callback="handleGoogleSignIn">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-text="signin_with" data-shape="rectangular" data-width="300"></div>

        <!-- FACEBOOK LOGIN -->
        <button class="social-btn fb-btn" onclick="loginWithFacebook()">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Mag-log in gamit ang Facebook
        </button>

        <div class="divider">O kaya</div>

        <!-- MANUAL LOGIN (pang-backup) -->
        <form id="loginForm" class="manual-divider">
            <input type="text" id="username" placeholder="👤 Username" required>
            <input type="password" id="password" placeholder="🔒 Password" required>
            <button type="submit" class="pass-btn">🔐 Pumasok gamit ang Password</button>
        </form>

        <p class="error-msg" id="errorMsg">❌ Hindi nakapasok — subukan ulit!</p>
        <p class="success-msg" id="successMsg">✅ Nakapasok na! Hintayin mo sandali...</p>
    </div>

    <script>
        // === MANUAL LOGIN ===
        const USERNAME = "bossniddo";
        const PASSWORD = "iyongpassword123";

        function goToMainPage() {
            localStorage.setItem("bossniddo_loggedin", "yes");
            document.getElementById("successMsg").style.display = "block";
            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);
        }

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;

            if(user === USERNAME && pass === PASSWORD) {
                goToMainPage();
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        });

        // === GOOGLE SIGN-IN ===
        function handleGoogleSignIn(response) {
            console.log("Google login success");
            // Kung nakapasok sa Google, payagan — pwede mo rin dito i-check ang email
            goToMainPage();
        }

        // === FACEBOOK SIGN-IN ===
        function loginWithFacebook() {
            FB.login(function(response) {
                if (response.authResponse) {
                    console.log('Facebook login success');
                    goToMainPage();
                } else {
                    document.getElementById("errorMsg").style.display = "block";
                }
            }, {scope: 'public_profile,email'});
        }
    </script>
</body>
</html>
