<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken Track List</title>
    <style>
        body {
            background-image: url("Boss Niddo1.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            padding-top: 10px;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* ✨ WELCOME — PINK TEXT + GREEN NEON GLOW ✨ */
        .neon-welcome {
            text-align: center;
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ff2eeb;
            text-shadow:
                0 0 8px #ff2eeb,
                0 0 15px #ff2eeb,
                0 0 30px #ff2eeb,
                0 0 60px #00ff41,
                0 0 90px #00ff41,
                0 0 120px #00dd38;
            animation: neon-pink-green-glow 1.2s ease-in-out infinite alternate;
            margin-bottom: 0;
            font-family: Arial, sans-serif;
        }

        @keyframes neon-pink-green-glow {
            from {
                text-shadow:
                    0 0 8px #ff2eeb,
                    0 0 15px #ff2eeb,
                    0 0 30px #ff2eeb,
                    0 0 50px #00ff41,
                    0 0 80px #00ff41;
            }
            to {
                text-shadow:
                    0 0 12px #ff4ffc,
                    0 0 25px #ff4ffc,
                    0 0 45px #ff4ffc,
                    0 0 80px #00ff41,
                    0 0 110px #00ff41,
                    0 0 150px #00dd38;
            }
        }

        h2 {
            display: none; /* Tinago para pantay na talaga */
        }

        .main-wrapper {
            display: flex;
            justify-content: flex-start;
            gap: 25px;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-top: -10px; /* ✅ ITAAS — Pantay na sa taas ng WELCOME */
        }

        /* ✅ SONG LIST BOX — PAIKLI NA AT PANTAY SA WELCOME ✅ */
        .track-list {
            margin-top: 0;
            text-align: left;
            background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(30,10,50,0.6));
            padding: 12px 15px; /* ✅ PAIKLI — Hindi na mahaba */
            border-radius: 12px;
            font-size: 13px; /* ✅ PINALIIT SULAT */
            line-height: 1.4; /* ✅ PAIKLI ANG PAGIT NG LINYA */
            width: 280px; /* ✅ PINALIIT ANG LAPAD */
            box-shadow: 0 0 18px rgba(150, 50, 255, 0.3);
            border: 1px solid rgba(200, 150, 255, 0.3);
        }

        .track-list ul {
            list-style: none;
            padding-left: 0;
            margin: 0 0 10px 0; /* ✅ PAIKLI SA ILALIM */
        }

        .track-list li {
            color: #ffdd00;
            text-shadow: 1px 1px 3px #000000;
            cursor: pointer;
            transition: all 0.4s ease;
            padding: 2px 6px; /* ✅ PAIKLI ANG PUWANG */
            border-radius: 5px;
        }

        .track-list li:hover {
            color: #ffffff;
            background-color: rgba(255, 221, 0, 0.2);
            padding-left: 10px;
        }

        .track-list li.playing {
            color: #ffffff;
            background: linear-gradient(90deg, rgba(255, 200, 0, 0.3), rgba(255, 150, 0, 0.1));
            box-shadow: 0 0 12px rgba(255, 200, 0, 0.6), 0 0 25px rgba(255, 150, 0, 0.3);
            animation: glow 1.2s ease-in-out infinite alternate;
            padding-left: 10px;
            font-weight: bold;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 8px rgba(255, 200, 0, 0.5), 0 0 15px rgba(255, 150, 0, 0.2);
            }
            to {
                box-shadow: 0 0 15px rgba(255, 200, 0, 0.9), 0 0 30px rgba(255, 150, 0, 0.5);
            }
        }

        .social-note {
            display: none; /* ✅ TINAGO — PARA HINDI HABA ANG BOX */
        }

        .arrows-line {
            display: none;
        }

        .social-links {
            display: none; /* ✅ TINAGO — PARA MAIKLI ANG BOX */
        }

        .player-container {
            margin-top: 8px;
            padding: 8px; /* ✅ PAIKLI */
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            text-align: center;
        }

        .now-playing {
            color: #ffdd00;
            font-size: 11px;
            margin-bottom: 5px;
            font-style: italic;
        }

        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 10px;
            margin-bottom: 5px;
            gap: 2px;
        }
        .bar {
            width: 2px;
            background-color: #ffffff;
            border-radius: 2px;
            animation: bounce 0.5s ease-in-out infinite alternate;
        }
        @keyframes bounce {
            from { height: 3px; }
            to { height: 10px; }
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .btn {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .btn.main {
            width: 34px;
            height: 34px;
            font-size: 14px;
        }

        .progress-wrap {
            width: 100%;
            margin-top: 4px;
        }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            cursor: pointer;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 2px;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -2px;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #ffffff;
            margin-top: 2px;
        }

        .volume-wrap {
            display: none; /* ✅ TINAGO — PARA HINDI HABA */
        }

        .comment-section {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(20,20,60,0.6));
            padding: 12px 15px;
            border-radius: 12px;
            width: 260px;
            box-shadow: 0 0 18px rgba(100, 180, 255, 0.25);
            border: 1px solid rgba(150, 200, 255, 0.3);
            z-index: 9999;
        }
        .comment-section h3 {
            color: #ffdd00;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 8px;
            text-shadow: 1px 1px 3px #000;
        }
        .comment-input-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        .comment-input-area input,
        .comment-input-area textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 7px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: #ffffff;
            font-size: 12px;
            outline: none;
        }
        .comment-input-area input::placeholder,
        .comment-input-area textarea::placeholder {
            color: #cccccc;
        }
        .comment-input-area button {
            padding: 7px 10px;
            background: linear-gradient(90deg, #ffdd00, #ffaa00);
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .comment-input-area button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 10px rgba(255, 221, 0, 0.5);
        }
        .comments-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .comment-item {
            background: rgba(255,255,255,0.08);
            padding: 7px 9px;
            border-radius: 6px;
            border-left: 3px solid #ffdd00;
        }
        .comment-name {
            font-weight: bold;
            color: #ffdd00;
            font-size: 11px;
            margin-bottom: 2px;
        }
        .comment-text {
            font-size: 12px;
            color: #ffffff;
            line-height: 1.3;
        }
        .comment-time {
            font-size: 10px;
            color: #aaaaaa;
            margin-top: 3px;
        }

        audio { display: none; }

        @media (max-width: 800px) {
            .neon-welcome {
                font-size: 48px;
                letter-spacing: 6px;
            }
            .main-wrapper { flex-direction: column; }
            .track-list { width: 280px; }
            .comment-section {
                position: relative;
                bottom: auto;
                right: auto;
                width: 280px;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ✨ WELCOME — PINK + GREEN NEON ✨ -->
    <div class="neon-welcome">WELCOME</div>

    <div class="main-wrapper">
        <!-- ✅ SONG LIST BOX — PAIKLI NA + PANTAY SA WELCOME ✅ -->
        <div class="track-list">
            <ul id="songList">
                <li data-file="Alone.mp3" onclick="playSong(this)">🎵 Alone</li>
                <li data-file="Andamanaya.mp3" onclick="playSong(this)">🎵 Andamanaya</li>
                <li data-file="broken angel.mp3" onclick="playSong(this)">🎵 Broken Angel</li>
                <li data-file="Do I have to cry for you.mp3" onclick="playSong(this)">🎵 Do I Have To Cry For You</li>
                <li data-file="Fixing a broken heart.mp3" onclick="playSong(this)">🎵 Fixing A Broken Heart</li>
                <li data-file="How do I live without you.mp3" onclick="playSong(this)">🎵 How Do I Live Without You</li>
                <li data-file="How do you heal a broken heart.mp3" onclick="playSong(this)">🎵 How Do You Heal A Broken Heart</li>
                <li data-file="I love you goodbye.mp3" onclick="playSong(this)">🎵 I Love You Goodbye</li>
            </ul>

            <div class="player-container">
                <div class="now-playing" id="nowPlaying">Select a song...</div>
                <div class="visualizer" id="visualizer"></div>
                <div class="controls">
                    <button class="btn" onclick="prevSong()">&#9664;</button>
                    <button class="btn main" id="playBtn" onclick="togglePlay()">&#9654;</button>
                    <button class="btn" onclick="nextSong()">&#9654;</button>
                </div>
                <div class="progress-wrap" onclick="seekTo(event)">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currTime">00:00</span>
                        <span id="durTime">00:00</span>
                    </div>
                </div>
                <audio id="player">
            </div>
        </div>
    </div>

    <!-- COMMENT SECTION -->
    <div class="comment-section">
        <h3>💬 Comment Section</h3>
        <p style="font-size:11px; color:#ccc; margin:0 0 8px 0;">May mensahe? Iwan mo dito!</p>
        <div class="comment-input-area">
            <input type="text" id="commenterName" placeholder="Pangalan..." maxlength="30">
            <textarea id="commentText" rows="2" placeholder="Komento..." maxlength="500"></textarea>
            <button onclick="addComment()">📤 Ipadala</button>
        </div>
        <div class="comments-list" id="commentsList"></div>
    </div>

    <script>
        let currentPlaying = null;
        let currentIndex = -1;
        const songFiles = [
            'Alone.mp3',
            'Andamanaya.mp3',
            'broken angel.mp3',
            'Do I have to cry for you.mp3',
            'Fixing a broken heart.mp3',
            'How do I live without you.mp3',
            'How do you heal a broken heart.mp3',
            'I love you goodbye.mp3'
        ];
        const songNames = {
            'Alone.mp3': 'Alone',
            'Andamanaya.mp3': 'Andamanaya',
            'broken angel.mp3': 'Broken Angel',
            'Do I have to cry for you.mp3': 'Do I Have To Cry For You',
            'Fixing a broken heart.mp3': 'Fixing A Broken Heart',
            'How do I live without you.mp3': 'How Do I Live Without You',
            'How do you heal a broken heart.mp3': 'How Do You Heal A Broken Heart',
            'I love you goodbye.mp3': 'I Love You Goodbye'
        };
        const player = document.getElementById('player');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const currTimeEl = document.getElementById('currTime');
        const durTimeEl = document.getElementById('durTime');
        const visualizer = document.getElementById('visualizer');
        player.volume = 0.7;

        for(let i=0; i<15; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.animationDelay = `${i*0.05}s`;
            visualizer.appendChild(bar);
        }

        function playSong(element) {
            if (currentPlaying) currentPlaying.classList.remove('playing');
            element.classList.add('playing');
            currentPlaying = element;
            const file = element.dataset.file;
            currentIndex = songFiles.indexOf(file);
            document.getElementById('nowPlaying').textContent = '🎶 ' + songNames[file];
            player.src = file;
            player.play();
            playBtn.innerHTML = '&#10074;&#10074;';
        }

        function togglePlay() {
            if (currentIndex === -1) return;
            if (player.paused) {
                player.play();
                playBtn.innerHTML = '&#10074;&#10074;';
            } else {
                player.pause();
                playBtn.innerHTML = '&#9654;';
            }
        }

        function prevSong() {
            if (currentIndex <= 0) return;
            const items = document.querySelectorAll('#songList li');
            playSong(items[currentIndex - 1]);
        }

        function nextSong() {
            if (currentIndex >= songFiles.length - 1) return;
            const items = document.querySelectorAll('#songList li');
            playSong(items[currentIndex + 1]);
        }

        function seekTo(e) {
            if (player.duration) {
                const rect = e.currentTarget.closest('.progress-bar').getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                player.currentTime = percent * player.duration;
            }
        }

        player.addEventListener('timeupdate', () => {
            if (player.duration) {
                const percent = (player.currentTime / player.duration) * 100;
                progressFill.style.width = percent + '%';
                currTimeEl.textContent = formatTime(player.currentTime);
                durTimeEl.textContent = formatTime(player.duration);
            }
        });

        player.addEventListener('ended', nextSong);
        player.addEventListener('pause', () => playBtn.innerHTML = '&#9654;');
        player.addEventListener('play', () => playBtn.innerHTML = '&#10074;&#10074;');

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        const STORAGE_KEY = 'bossniddo_comments';
        function loadComments() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : [];
        }
        function saveComments(comments) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
        }
        function renderComments() {
            const list = document.getElementById('commentsList');
            const comments = loadComments();
            list.innerHTML = '';
            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div class="comment-name">${escapeHtml(c.name)}</div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                    <div class="comment-time">${c.time}</div>
                `;
                list.prepend(item);
            });
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function addComment() {
            const nameInput = document.getElementById('commenterName');
            const textInput = document.getElementById('commentText');
            const name = nameInput.value.trim() || 'Anonimo';
            const text = textInput.value.trim();
            if (!text) {
                alert('⚠️ Isulat muna ang komento!');
                return;
            }
            const now = new Date();
            const time = now.toLocaleString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
            const comments = loadComments();
            comments.push({ name, text, time });
            saveComments(comments);
            renderComments();
            nameInput.value = '';
            textInput.value = '';
            alert('✅ Salamat sa komento!');
        }
        renderComments();
    </script>
</body>
</html>
