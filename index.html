<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Glassmorphism</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #b8c6ff 0%, #e0e7ff 100%);
            padding: 20px;
        }

        .checkout-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            padding: 35px;
            width: 100%;
            max-width: 450px;
        }

        .secure-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .payment-methods {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .method {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .method.active {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.1);
        }

        .method img {
            height: 24px;
            object-fit: contain;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.4);
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.3);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        .save-card {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 13px;
            color: #4a5568;
        }

        .process-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .process-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="checkout-card">
        <div class="secure-label">🔒 Secure Checkout</div>

        <div class="payment-methods">
            <div class="method">
                <span>💳</span>
            </div>
            <div class="method active">
                <span>PayPal</span>
            </div>
            <div class="method">
                <span>🟠</span>
            </div>
        </div>

        <div class="form-group">
            <label>Card Number</label>
            <input type="text" placeholder="1234 5678 9012 3456">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Expiry</label>
                <input type="text" placeholder="MM/YY">
            </div>
            <div class="form-group">
                <label>CVC</label>
                <input type="text" placeholder="123">
            </div>
        </div>

        <label class="save-card">
            <input type="checkbox"> Save card details
        </label>

        <button class="process-btn">Process Payment</button>
    </div>
</body>
</html>
