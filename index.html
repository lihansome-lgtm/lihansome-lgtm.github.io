<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Niddo Music Production</title>
    <style>
        body {
            background-image: url("Boss Niddo.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            padding-top: 50px;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-left: 50px;
        }

        h1 {
            font-size: 48px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            margin: 0;
        }

        h2 {
            font-size: 30px;
            margin-top: 80px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .track-list {
            margin-top: 10px;
            text-align: left;
            background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(30,10,50,0.6));
            padding: 30px 35px;
            border-radius: 15px;
            font-size: 20px;
            line-height: 2.2;
            width: 520px;
            box-shadow: 0 0 25px rgba(150, 50, 255, 0.3);
            border: 1px solid rgba(200, 150, 255, 0.3);
        }

        .track-list ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .track-list li {
            color: #ffdd00;
            text-shadow: 1px 1px 3px #000000;
            cursor: pointer;
            transition: all 0.4s ease;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .track-list li:hover {
            color: #ffffff;
            background-color: rgba(255, 221, 0, 0.2);
            padding-left: 15px;
        }

        .track-list li.playing {
            color: #ffffff;
            background: linear-gradient(90deg, rgba(255, 200, 0, 0.3), rgba(255, 150, 0, 0.1));
            box-shadow: 0 0 15px rgba(255, 200, 0, 0.6), 0 0 30px rgba(255, 150, 0, 0.3);
            animation: glow 1.2s ease-in-out infinite alternate;
            padding-left: 15px;
            font-weight: bold;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 10px rgba(255, 200, 0, 0.5), 0 0 20px rgba(255, 150, 0, 0.2);
            }
            to {
                box-shadow: 0 0 20px rgba(255, 200, 0, 0.9), 0 0 40px rgba(255, 150, 0, 0.5);
            }
        }

        .player-container {
            margin-top: 25px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.2);
        }

        .player {
            width: 100%;
            height: 45px;
        }

        .now-playing {
            color: #ffdd00;
            font-size: 16px;
            margin-bottom: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>🎵 Boss Niddo Music Production 🎵</h1>

    <h2>📋 Broken Track List</h2>
    <div class="track-list">
        <ul>
            <li onclick="playSong(this, 'Alone.mp3')">🎵 Alone</li>
            <li onclick="playSong(this, 'Andamanaya.mp3')">🎵 Andamanaya</li>
            <li onclick="playSong(this, 'broken angel.mp3')">🎵 Broken Angel</li>
            <li onclick="playSong(this, 'Do I have to cry for you.mp3')">🎵 Do I Have To Cry For You</li>
            <li onclick="playSong(this, 'Fixing a broken heart.mp3')">🎵 Fixing A Broken Heart</li>
            <li onclick="playSong(this, 'How do I live without you.mp3')">🎵 How Do I Live Without You</li>
            <li onclick="playSong(this, 'How do you heal a broken heart.mp3')">🎵 How Do You Heal A Broken Heart</li>
            <li onclick="playSong(this, 'I love you, goodbye.mp3')">🎵 I Love You, Goodbye</li>
        </ul>

        <div class="player-container">
            <div class="now-playing" id="nowPlaying">Select a song to play...</div>
            <audio id="player" class="player" controls>
        </div>
    </div>

    <script>
        let currentPlaying = null;
        const songNames = {
            'Alone.mp3': 'Alone',
            'Andamanaya.mp3': 'Andamanaya',
            'broken angel.mp3': 'Broken Angel',
            'Do I have to cry for you.mp3': 'Do I Have To Cry For You',
            'Fixing a broken heart.mp3': 'Fixing A Broken Heart',
            'How do I live without you.mp3': 'How Do I Live Without You',
            'How do you heal a broken heart.mp3': 'How Do You Heal A Broken Heart',
            'I love you, goodbye.mp3': 'I Love You, Goodbye'
        };

        function playSong(element, filename) {
            if (currentPlaying) {
                currentPlaying.classList.remove('playing');
            }

            element.classList.add('playing');
            currentPlaying = element;

            document.getElementById('nowPlaying').textContent = '🎶 Now Playing: ' + songNames[filename];

            const player = document.getElementById('player');
            player.src = filename;
            player.play();
        }
    </script>
</body>
</html>
